<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta property="og:title" content="Saturday Smash 🎾 KLTC"><meta property="og:description" content="Order of play, player cards and the Saturday ladder. What kind of player are you?"><meta property="og:image" content="https://juratebrasiene-art.github.io/kltc-smash/og.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:url" content="https://juratebrasiene-art.github.io/kltc-smash/"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>KLTC Saturday Smash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap">
<style id="tpl-style">
/* Layout: a scoreboard band on top, then one phone-width column of court cards — like the board by the clubhouse */
:root{
  --bg:#f3f5ef; --surface:#ffffff; --ink:#15241d; --muted:#5d6e66; --line:#dbe2dc;
  --court:#1f5d46; --court-deep:#123b2c; --on-court:#f3f7ef; --chalk-line:rgba(255,255,255,.16);
  --ball:#d6ee3b; --ball-ink:#273000; --clay:#c2532d; --clay-soft:#f7e3da; --good:#1f7a4f; --good-soft:#dcefe3;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  --p-attack:#d9472b; --p-wall:#8a5636; --p-net:#5a3fa6; --p-tactics:#2c67b0; --p-fun:#d23a8a; --p-all:#1f5d46;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1712; --surface:#13241c; --ink:#e7efe9; --muted:#97aba1; --line:#223a2e;
  --court:#226b50; --court-deep:#0d2c21; --on-court:#eef5ea; --chalk-line:rgba(255,255,255,.10);
  --ball:#d2ea3c; --ball-ink:#222a00; --clay:#e2754f; --clay-soft:#3a2219; --good:#5cc38c; --good-soft:#163527; --p-attack:#e8603f; --p-wall:#a8714c; --p-net:#7b5fd6; --p-tactics:#4a86d4; --p-fun:#e25ea4; --p-all:#2a7a5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1712; --surface:#13241c; --ink:#e7efe9; --muted:#97aba1; --line:#223a2e;
  --court:#226b50; --court-deep:#0d2c21; --on-court:#eef5ea; --chalk-line:rgba(255,255,255,.10);
  --ball:#d2ea3c; --ball-ink:#222a00; --clay:#e2754f; --clay-soft:#3a2219; --good:#5cc38c; --good-soft:#163527; --p-attack:#e8603f; --p-wall:#a8714c; --p-net:#7b5fd6; --p-tactics:#4a86d4; --p-fun:#e25ea4; --p-all:#2a7a5c; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--court-deep)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:760px;margin:0 auto}

/* scoreboard band */
.band{background:
  linear-gradient(var(--chalk-line),var(--chalk-line)) 50% 0/2px 100% no-repeat,
  linear-gradient(90deg,transparent 12%,var(--chalk-line) 12%,var(--chalk-line) calc(12% + 2px),transparent calc(12% + 2px),transparent calc(88% - 2px),var(--chalk-line) calc(88% - 2px),var(--chalk-line) 88%,transparent 88%),
  linear-gradient(160deg,var(--court) 0%,var(--court-deep) 75%);
  color:var(--on-court);padding-block:22px 18px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.85}
h1{font-family:var(--display);font-weight:900;font-size:clamp(40px,11vw,70px);line-height:.9;margin:2px 0 4px;letter-spacing:.01em;text-wrap:balance}
h1 .ballword{color:var(--ball)}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.logo{width:clamp(78px,21vw,108px);height:auto;flex:none;overflow:visible;filter:drop-shadow(0 4px 0 rgba(0,0,0,.28));animation:pop .8s cubic-bezier(.2,1.7,.4,1) both}
.logo .burst{fill:var(--clay);stroke:var(--ball-ink);stroke-width:2.5;stroke-linejoin:round}
.logo .streaks path{stroke:#fff;stroke-width:6;stroke-linecap:round;opacity:.9}
.logo .ballc{fill:var(--ball);stroke:var(--ball-ink);stroke-width:3}
.logo .seam path{fill:none;stroke:#fff;stroke-width:4.5;stroke-linecap:round}
.logo .shine{fill:#fff;opacity:.55}
.logo .ballg{transform-origin:66px 58px;animation:wob 3.2s ease-in-out .8s infinite}
.brand:hover .logo .ballg{animation-duration:.6s}
@keyframes pop{from{transform:scale(.2) rotate(-40deg);opacity:0}}
@keyframes wob{0%,100%{transform:rotate(0)}40%{transform:rotate(-14deg) translate(-2px,1px)}60%{transform:rotate(10deg)}}
.h-sat{display:block;font-size:.46em;letter-spacing:.08em;text-transform:uppercase;opacity:.92}
.h-smash{display:inline-block;color:var(--ball);font-size:1.12em;transform:skewX(-9deg) rotate(-3deg);transform-origin:left bottom;text-shadow:3px 3px 0 var(--clay),6px 6px 0 rgba(0,0,0,.28);text-transform:uppercase;letter-spacing:.02em}
.board{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;background:rgba(255,255,255,.12);color:var(--on-court)}
.chip.ball{background:var(--ball);color:var(--ball-ink)}
.digits{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.03em;font-variant-numeric:tabular-nums}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .col{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:13px 12px 11px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--court)}
.save{margin-left:auto;align-self:center;font-size:12px;color:var(--muted);white-space:nowrap;padding-left:8px}

main{padding-block:18px 60px}
.stack{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.stack>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;margin:0 0 4px;letter-spacing:.01em}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}

.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:700;background:var(--court);color:var(--on-court)}
.btn.ball{background:var(--ball);color:var(--ball-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:7px 13px;font-size:13px}
.btn.clay{background:var(--clay);color:#fff}
.btn:disabled{opacity:.5;cursor:default}

/* headcount */
.count{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.big{font-family:var(--display);font-weight:900;font-size:72px;line-height:.8;font-variant-numeric:tabular-nums}
.big small{font-size:22px;font-weight:800;display:block;margin-top:6px;color:var(--muted);letter-spacing:.04em}
.courtsviz{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cz{width:54px;height:36px;border-radius:6px;background:var(--court);position:relative;display:grid;grid-template-columns:1fr 1fr;padding:5px 7px;gap:3px 14px;
  box-shadow:inset 0 0 0 1.5px var(--chalk-line)}
.cz::after{content:"";position:absolute;left:50%;top:3px;bottom:3px;width:1.5px;background:rgba(255,255,255,.55)}
.cz i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.18);align-self:center;justify-self:center}
.cz i.on{background:var(--ball);box-shadow:0 0 0 2px rgba(0,0,0,.12)}
.cz.empty{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.cz.empty::after{background:var(--line)}
.cz.empty i{background:var(--line)}
.advice{margin-top:10px;font-weight:600}
.advice.ok{color:var(--good)} .advice.warn{color:var(--clay)}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.meter b{display:block;height:100%;background:var(--ball)}

/* order of play */
.round{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.round.now{border-color:var(--ball);box-shadow:0 0 0 2px var(--ball)}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:var(--court-deep);color:var(--on-court)}
.rhead .rn{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.02em}
.rhead .t{font-variant-numeric:tabular-nums;font-weight:600;opacity:.9}
.live{background:var(--ball);color:var(--ball-ink);font-size:11px;font-weight:800;letter-spacing:.12em;padding:3px 8px;border-radius:99px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.match{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.match:first-of-type{border-top:0}
.cn{font-family:var(--display);font-weight:800;font-size:13px;line-height:1;text-align:center;color:var(--muted);letter-spacing:.06em}
.cn b{display:block;font-size:28px;color:var(--court)}
.teams{min-width:0;display:grid;gap:2px}
.team{font-weight:600;overflow-wrap:anywhere}
.team.win{color:var(--good)}
.vs{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--muted)}
.open{color:var(--clay);font-weight:700}
.score{width:74px;text-align:center;border:1.5px solid var(--line);border-radius:10px;padding:8px 4px;background:var(--bg);font-weight:700;font-variant-numeric:tabular-nums}
.scoreview{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;color:var(--court)}
.rest{padding:10px 16px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--muted)}
.quest{padding:10px 16px;border-top:1px solid var(--line);background:var(--good-soft);font-size:13.5px}
.quest b{color:var(--good)}
.flip{animation:flip .55s cubic-bezier(.2,.8,.2,1.2) both}
@keyframes flip{from{opacity:0;transform:translateY(8px) rotateX(70deg)}to{opacity:1;transform:none}}
.draft{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.12em;background:var(--clay-soft);color:var(--clay);padding:3px 8px;border-radius:99px;vertical-align:middle}

/* players */
.plist{display:grid}
.pl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}
.pname{font-weight:700;min-width:0;overflow-wrap:anywhere}
.pmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 11px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"].in{background:var(--court);color:var(--on-court)}
.seg button[aria-pressed="true"].reserve{background:var(--ball);color:var(--ball-ink)}
.seg button[aria-pressed="true"].out{background:var(--clay);color:#fff}
.stars{display:inline-flex;gap:2px}
.stars button{border:0;background:none;padding:2px;font-size:15px;line-height:1;color:var(--line)}
.stars button.on{color:var(--court)}
.tog{border:1.5px solid var(--line);background:none;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;color:var(--muted)}
.tog[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.x{border:0;background:none;color:var(--muted);font-size:18px;padding:4px 8px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.badge.hero{background:var(--clay-soft);border-color:transparent;color:var(--clay)}
.badge.fire{background:var(--ball);border-color:transparent;color:var(--ball-ink)}
.status-tag{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=url],textarea,select{
  border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
details summary{cursor:pointer;font-weight:700}
details[open] summary{margin-bottom:12px}

/* ladder */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 6px;border-bottom:1.5px solid var(--line);font-weight:800}
th:nth-child(2),td:nth-child(2){text-align:left}
td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right}
td.pos{font-family:var(--display);font-weight:800;font-size:20px;color:var(--muted);width:34px}
tr.top td.pos{color:var(--court)}
td.pts{font-family:var(--display);font-weight:800;font-size:20px}
.potd{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:linear-gradient(140deg,var(--court),var(--court-deep));color:var(--on-court);border-radius:var(--r);padding:16px;border:0}
.potd .crown{font-size:44px;line-height:1}
.potd h3{font-family:var(--display);font-weight:900;font-size:30px;margin:0;line-height:1}
.potd p{margin:2px 0 0;opacity:.9}

/* share */
pre.wa{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0 12px;font-family:var(--body);font-size:14px;max-height:340px;overflow:auto}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,15,10,.55);z-index:20;display:grid;align-items:end;justify-items:center}
.sheet{background:var(--surface);width:min(560px,100%);border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:85vh;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h3{font-family:var(--display);font-weight:800;font-size:28px;margin:0 0 4px;line-height:1}
.pick{display:grid;gap:8px;margin:14px 0}
.pick button{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.pick button:hover{border-color:var(--court)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:30;font-size:14px;max-width:calc(100% - 32px)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
.empty-note{color:var(--muted);text-align:center;padding:18px 8px}
.ro{font-size:12.5px;color:var(--muted)}
@media (max-width:560px){.pl{grid-template-columns:minmax(0,1fr)}}
@media (max-width:440px){
  .match{grid-template-columns:36px 1fr auto;gap:10px;padding:12px}
  .rhead,.rest,.quest{padding-left:12px;padding-right:12px}
  .big{font-size:60px}
}

.secttl{font-family:var(--display);font-weight:800;font-size:24px;margin:8px 0 -4px}
/* squad dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:2px}
.tile .ti{font-size:20px}
.tile b{font-family:var(--display);font-weight:900;font-size:38px;line-height:1;font-variant-numeric:tabular-nums;color:var(--court)}
.tile b small{font-size:18px;color:var(--muted)}
.tile span:last-child{font-size:12.5px;color:var(--muted);font-weight:600}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.dgrid>*{min-width:0}
.bars{display:grid;gap:8px;margin-top:10px}
.bar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:13.5px}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:12px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bt b{display:block;height:100%;background:var(--court);border-radius:99px}
.bn{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end;height:150px;margin-top:12px}
.colb{display:grid;grid-template-rows:auto 1fr auto;height:100%;text-align:center;gap:4px}
.cbar{display:flex;align-items:flex-end;background:var(--bg);border-radius:8px;overflow:hidden}
.cbar b{display:block;width:100%;background:var(--ball);border-radius:8px 8px 0 0}
.cv{font-weight:800;font-variant-numeric:tabular-nums}.cl{font-size:12px;color:var(--muted);font-weight:700}
/* help guide */
.band .col{position:relative}
.helpbtn{border:2px solid var(--ball);background:transparent;color:var(--on-court);border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.helpbtn:hover{background:var(--ball);color:var(--ball-ink);transform:rotate(-2deg)}
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.step{position:relative;display:grid;gap:4px;justify-items:start;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px;animation:flip .5s cubic-bezier(.2,.8,.2,1.2) both}
.step{text-align:left;cursor:pointer;color:var(--ink);transition:transform .15s,border-color .15s}
.step:hover{transform:translateY(-2px) rotate(-.6deg);border-color:var(--pc)}
.step:active{transform:scale(.97)}
.go{margin-top:4px;font-size:12px;font-weight:800;color:var(--pc);letter-spacing:.02em}
.glow{animation:glow 1.8s ease-out}
@keyframes glow{0%,40%{box-shadow:0 0 0 4px var(--ball)}100%{box-shadow:0 0 0 0 transparent}}
[id^="sec-"]{scroll-margin-top:60px}
.step b{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.05}
.step .sl{font-size:12.5px;color:var(--muted);line-height:1.3}
.bub{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--pc);box-shadow:0 3px 0 rgba(0,0,0,.18);margin-bottom:4px}
.sn{position:absolute;top:8px;right:10px;font-family:var(--display);font-weight:900;font-size:22px;color:var(--pc);opacity:.85}
/* player cards wall */
.pc-attack{--pc:var(--p-attack)} .pc-wall{--pc:var(--p-wall)} .pc-net{--pc:var(--p-net)} .pc-tactics{--pc:var(--p-tactics)} .pc-fun{--pc:var(--p-fun)} .pc-all{--pc:var(--p-all)}
.album{background:linear-gradient(150deg,var(--court),var(--court-deep));color:var(--on-court);border-radius:var(--r);padding:18px;display:grid;gap:10px}
.album h2{font-family:var(--display);font-weight:900;font-size:clamp(32px,8vw,44px);line-height:.95;margin:2px 0 0}
.album p{margin:0;opacity:.9}
.got{font-family:var(--display);font-weight:800;font-size:22px;text-align:right;line-height:1}
.got b{font-size:46px;color:var(--ball)}
.got span{display:block;font-family:var(--body);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.8}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tcard{perspective:900px;aspect-ratio:3/4;max-width:100%;min-width:0}

.tstats{margin-top:auto;font-size:11px;font-weight:800;color:var(--muted)}

.mystery .tname{font-size:20px;color:var(--ink)}
.mini{border-left:5px solid var(--pc,var(--line))!important}

.tally.yes{background:var(--good-soft);border-color:transparent;color:var(--good)}
.tally.no{background:var(--clay-soft);border-color:transparent;color:var(--clay)}
.rc{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.rcb{border:1.5px dashed var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.rcb.yes{border:1.5px solid var(--good);background:var(--good-soft);color:var(--good)}
.rcb.no{border:1.5px solid var(--clay);background:var(--clay-soft);color:var(--clay)}
.rcb.away{border-style:solid;opacity:.7}
.rcb small{font-weight:600;color:var(--muted)}
.rcb:disabled{cursor:default}

.pcard h2{font-family:var(--display);font-weight:900;font-size:clamp(40px,11vw,60px);line-height:.9;margin:0;overflow-wrap:anywhere}
.pcard p{margin:0;opacity:.92}
.pc-icon{font-size:56px;line-height:1}

function parseScore(s){const m=String(s||"").match(/(\d+)\s*[-–:\/ ]\s*(\d+)/);return m?[+m[1],+m[2]]:null}
function dayResults(oop,date){
  const res={};const add=(id,pts,gf,ga,w,l)=>{if(!id)return;const o=res[id]||(res[id]={p:0,w:0,l:0,pts:0,gf:0,ga:0});o.p++;o.w+=w;o.l+=l;o.pts+=pts;o.gf+=gf;o.ga+=ga};
  if(oop)oop.rounds.forEach(rd=>rd.courts.forEach(c=>{const m=parseScore(c.score);if(!m)return;const [x,y]=m;
    const pa=x>y?3:x<y?1:2,pb=x<y?3:x>y?1:2;
    c.a.forEach(id=>add(id,pa,x,y,x>y?1:0,x<y?1:0));c.b.forEach(id=>add(id,pb,y,x,y>x?1:0,y<x?1:0))}));
  S.players.forEach(p=>{if(p.heroDate===date){const o=res[p.id]||(res[p.id]={p:0,w:0,l:0,pts:0,gf:0,ga:0});o.pts+=2;o.hero=1}});
  return res;
}
const attendedIn=oop=>{const s=new Set();if(oop)oop.rounds.forEach(rd=>{rd.courts.forEach(c=>c.a.concat(c.b).forEach(i=>i&&s.add(i)));rd.rest.forEach(i=>s.add(i))});return [...s]};
function rank(res){return Object.entries(res).sort((a,b)=>(b[1].pts-a[1].pts)||((b[1].gf-b[1].ga)-(a[1].gf-a[1].ga))||(b[1].w-a[1].w))}
function season(){
  const tot={};
  const fold=(res)=>Object.entries(res).forEach(([id,o])=>{const t=tot[id]||(tot[id]={p:0,w:0,l:0,pts:0,gf:0,ga:0,days:0,heroes:0});
    t.p+=o.p;t.w+=o.w;t.l+=o.l;t.pts+=o.pts;t.gf+=o.gf;t.ga+=o.ga;t.heroes+=o.hero?1:0});
  S.history.forEach(h=>{fold(h.res);h.attended.forEach(id=>{(tot[id]||(tot[id]={p:0,w:0,l:0,pts:0,gf:0,ga:0,days:0,heroes:0})).days++})});
  return tot;
}
function streak(id){const h=S.history.slice().sort((a,b)=>a.date<b.date?1:-1);let n=0;for(const e of h){if(e.attended.includes(id))n++;else break}return n}
function badgesFor(id,tot){
  const b=[];const p=pBy(id);
  if(isHero(p))b.push(["hero","🦸 Hero today"]);
  const st=streak(id);if(st>=3)b.push(["fire","🔥 "+st+" in a row"]);
  if(tot&&tot[id]&&tot[id].heroes)b.push(["hero","🦸×"+tot[id].heroes]);
  const potd=S.history.filter(h=>h.potd===id).length;if(potd)b.push(["","👑×"+potd]);
  const unbeaten=S.history.filter(h=>h.res[id]&&h.res[id].p>=2&&h.res[id].l===0).length;if(unbeaten)b.push(["","💪 unbeaten ×"+unbeaten]);
  return b;
}

/* ---------- headcount ---------- */
function headcount(){
  const n=inIds().length,C=S.courts,full=Math.floor(n/4),extra=n%4;
  let cls="ok",msg;
  if(n<4){cls="warn";msg="Need "+(4-n)+" more to open a court"}
  else if(full>C){cls="ok";msg="Courts full: "+C*4+" play each round, "+(n-C*4)+" rotate out"}
  else if(extra===0){msg="Perfect – "+full+" court"+(full>1?"s":"")+", nobody sits out"}
  else if(full<C){cls="warn";msg=extra+" sit out each round – or find "+(4-extra)+" more to open court "+(full+1)}
  else {cls="warn";msg=extra+" rotate out each round (all "+C+" courts in use)"}
  return {n,full:Math.min(full,C),cls,msg,need:n%4?4-n%4:0};
}

/* card codes: short "v2" text (2~name~kind~answers~multi~rsvp~away~motto), base64 so it travels as one word */
const V2S=["goal","avail","priority","oncall","warm","style","weapon","level","fuel","rain"],V2M=["motives","better"];
const qOf=k=>QUIZ.find(x=>x.k===k);
const ymd=d=>d.slice(2).replace(/-/g,""),unymd=c=>"20"+c.slice(0,2)+"-"+c.slice(2,4)+"-"+c.slice(4,6);

  const many=V2M.map(k=>{let m=0;(a[k]||[]).forEach(v=>{const i=qOf(k).opts.findIndex(o=>o[0]===v);if(i>=0)m|=1<<i});return m.toString(36)}).join(".");

function dec(code){

  const [v,name,kind,one,many,r,aw,...rest]=t.split("~");
  if(v!=="2")throw new Error("unknown card");
  const a={name};
  if(kind==="p")a.partial=true;
  else{
    V2S.forEach((k,i)=>{const c=(one||"")[i];if(c&&c!=="-"){const o=qOf(k).opts[parseInt(c,36)];if(o)a[k]=o[0]}});
    (many||"").split(".").forEach((m,j)=>{const bits=parseInt(m||"0",36);a[V2M[j]]=qOf(V2M[j]).opts.filter((o,i)=>bits&(1<<i)).map(o=>o[0])});

  }

function unhideAll(t){return String(t||"").replace(/\u2063\u2063([\u200b\u200c\u200d\u2060]+)\u2064/g,(m,z)=>{let bin="";for(let i=0;i+3<z.length;i+=4)bin+=String.fromCharCode(ZW.indexOf(z[i])<<6|ZW.indexOf(z[i+1])<<4|ZW.indexOf(z[i+2])<<2|ZW.indexOf(z[i+3]));return " #smash:"+btoa(bin).replace(/=+$/,"")})}

function applyAnswers(a){

function quizAct(a,t){
  const z=ui.quiz;
  if(a==="qzstart"||a==="qzagain"){ui.quiz={step:0,a:{}};render();return}
  if(a==="qzavail"){ui.quiz={mode:"avail",a:{}};render();return}
  if(a==="qzaway0"){ui.quiz=null;render();return}
  if(!z)return;
  if(a==="qzawadd"){const v=readAway("qzaw");if(!v){toast("Pick a From date first");return}const n=$("#qa-name");if(n)z.a.name=n.value.trim();z.a.away=(z.a.away||[]).concat(v);render();return}
  if(a==="qzawdel"){z.a.away.splice(+t.dataset.i,1);render();return}
  if(a==="qzrsvp"){z.a.rsvp={date:S.date,v:t.dataset.v};const n=$("#qa-name");if(n)z.a.name=n.value.trim();render();return}
  if(a==="qzavaildone"){const n=$("#qa-name");z.a.name=n?n.value.trim():z.a.name;const v=readAway("qzaw");if(v)z.a.away=(z.a.away||[]).concat(v);
    if(!z.a.name){toast("Pop your name in first");return}if(!z.a.rsvp&&!(z.a.away||[]).length){toast("Tap 👍 or 👎, or add away dates");return}
    z.a.partial=true;z.done=true;if(canEdit)mutate(()=>{applyAnswers(z.a)});render();return}
  if(!z)return;
  const q=QUIZ[z.step];
  if(a==="qzback"){z.step=Math.max(0,z.step-1);render();return}
  if(a==="qzpick"){const v=t.dataset.v;
    if(q.type==="multi"){const cur=z.a[q.k]||[];z.a[q.k]=cur.includes(v)?cur.filter(x=>x!==v):cur.length>=q.max?cur.slice(1).concat(v):cur.concat(v);render();return}
    z.a[q.k]=v;render();setTimeout(()=>{if(ui.quiz===z&&QUIZ[z.step]===q)advance()},260);return}
  if(a==="qznext"){const inp=$("#qz-"+q.k);if(inp)z.a[q.k]=inp.value.trim();
    if(q.type==="text"&&!q.optional&&!z.a[q.k]){toast("Pop your name in first");return}
    advance()}
}

function applyAway(p,list){
  if(!list||!list.length)return;
  p.away=(p.away||[]).concat(list.filter(a=>a&&/^\d{4}-\d\d-\d\d$/.test(a.from)).map(a=>({from:a.from,to:/^\d{4}-\d\d-\d\d$/.test(a.to||"")?a.to:a.from,note:String(a.note||"").slice(0,60)})));
  const seen=new Set();p.away=p.away.filter(a=>{const k=a.from+a.to;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>a.from<b.from?-1:1);
  if(awayOn(p,S.date)&&!(S.oop&&attendedIn(S.oop).includes(p.id)))p.status="out";

function newId(){return "p"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36)}
function addNames(txt,status){
  const names=txt.split(/[\n,;]+/).map(s=>s.replace(/^[\s\d.)\-•*~]+/,"").replace(/\s+/g," ").trim()).filter(Boolean);
  const back=S.players.filter(p=>p.removed&&names.some(n=>n.toLowerCase()===p.name.toLowerCase()));
  back.forEach(p=>{p.removed=false;p.status=status});
  const have=new Set(S.players.map(p=>p.name.toLowerCase()));
  const fresh=names.filter(n=>!have.has(n.toLowerCase()));
  if(back.length&&!fresh.length){mutate(()=>{});toast(back.length+" back on the squad");return}
  if(!fresh.length){toast(names.length?"They're all on the list already":"Type or paste some names first");return}
  mutate(s=>fresh.forEach(n=>s.players.push({id:newId(),name:n.slice(0,40),level:3,status,warmup:false})));
  toast(fresh.length+" added");
}
function doSwap(outId,inId,slot){
  mutate(s=>{
    if(outId){const po=pBy(outId);if(po)po.status="out"}
    if(inId){const pi=pBy(inId);pi.status="in";pi.heroDate=s.date}
    if(s.oop){
      const from=slot?0:fromRound();
      s.oop.rounds.forEach((rd,ri)=>{
        if(ri<from)return;
        if(slot){if(ri!==slot.r)return;rd.courts[slot.c][slot.s][slot.j]=inId;return}
        if(inId&&inRound(rd,inId)&&!inRound(rd,outId))return;
        rd.courts.forEach(c=>{c.a=c.a.map(x=>x===outId?(inId||null):x);c.b=c.b.map(x=>x===outId?(inId||null):x)});
        rd.rest=rd.rest.map(x=>x===outId?inId:x).filter(Boolean);
      });
      if(slot&&inId){s.oop.rounds.forEach((rd,ri)=>{if(ri>slot.r)rd.courts.forEach(c=>{["a","b"].forEach(k=>{c[k]=c[k].map(x=>x===null&&!inRound(rd,inId)?inId:x)})})})}
      if(outId)s.oop.swaps.push({out:outId,in:inId||null});
      else if(inId){const open=s.oop.swaps.filter(w=>!w.in).pop();if(open)open.in=inId;else s.oop.swaps.push({out:null,in:inId})}
    }
  });
  ui.sheet=null;render();
  toast(inId?"🦸 "+first(inId)+" is in – thank you!":"Spot left open – post the Late swap message");
}
function finishDay(){
  const res=dayResults(S.oop,S.date);const r=rank(res);
  const potd=r.length&&r[0][1].p?r[0][0]:null;
  mutate(s=>{
    s.history.push({date:s.date,res,attended:attendedIn(s.oop),heroes:s.players.filter(p=>p.heroDate===s.date).map(p=>p.id),potd});
    s.date=iso(new Date(dOf(s.date).getTime()+7*864e5));s.oop=null;s.shuffle=0;
    s.players.forEach(p=>{if(awayOn(p,s.date))p.status="out";else if(p.status==="out")p.status="in";delete p.heroDate;delete p.rsvp});
  });
  ui.sheet=null;ui.tab="today";render();confetti();
  toast(potd?"👑 "+nm(potd)+" is Player of the day!":"Saturday banked – see you next week");
}

    case "rsvp":{const v=rsvp(pBy(id));setRsvp(id,v===null?"yes":v==="yes"?"no":null);break}
    case "pawadd":{const a=readAway("paw");if(!a){toast("Pick a From date first");return}mutate(s=>applyAway(pBy(id),[a]));toast("✈️ Away dates saved");break}
    case "pawdel":mutate(s=>{const p=pBy(id);p.away.splice(+t.dataset.i,1);if(!awayOn(p,s.date)&&p.status==="out")p.status="in"});break;
    case "finishask":ui.sheet={type:"finish"};render();break;
    case "finish":finishDay();break;
    case "toggle":mutate(s=>{if(t.dataset.k==="wu.on")s.warmup.on=!s.warmup.on;else s.challenges=!s.challenges});break;
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.act==="qztext"){e.preventDefault();quizAct("qznext",e.target)}});
document.addEventListener("change",e=>{
  const t=e.target;if(!canEdit||!t.dataset)return;
  if(t.dataset.act==="pphone"){const ok=setPhone(t.dataset.id,t.value.trim().slice(0,20));toast(ok?"Number saved on this device only":"This browser won't store numbers – use Copy instead");render();return}
  if(t.dataset.act==="score"){const r=+t.dataset.r,c=+t.dataset.c,v=t.value.trim();
    mutate(s=>{s.oop.rounds[r].courts[c].score=v});
    const sc=parseScore(v);if(sc&&sc[0]!==sc[1])toast("🎾 Nice – ladder updated");return}
  if(t.dataset.act==="set"){const k=t.dataset.k,v=t.value;
    mutate(s=>{
      if(k==="org.name"||k==="org.phone"){s.org=s.org||{name:"",phone:""};s.org[k.slice(4)]=v.trim().slice(0,30)}
      else if(k==="wu.start")s.warmup.start=v||s.warmup.start;
      else if(k==="wu.end")s.warmup.end=v||s.warmup.end;
      else if(["courts","rounds","roundMins"].includes(k)){const n=parseInt(v,10);if(n>0){s[k]=n;if(s.oop&&k!=="roundMins"){s.oop=null;toast("Order of play reset for the new "+k)}}}
      else if(k==="date"){if(v)s.date=v}
      else if(k==="start"){if(v)s.start=v}
      else s[k]=v.trim();
    });}
});
function selectText(k){const el=$("#wa-"+k);const r=document.createRange();r.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast("Selected – press Copy on your keyboard")}

/* ---------- confetti: tennis balls + chalk ---------- */
function confetti(count){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=$("#fx");if(!cv)return;const ctx=cv.getContext("2d");const W=cv.width=innerWidth*devicePixelRatio,H=cv.height=innerHeight*devicePixelRatio;
  const cs=getComputedStyle(document.documentElement);const cols=[cs.getPropertyValue("--ball").trim(),"#ffffff",cs.getPropertyValue("--court").trim(),cs.getPropertyValue("--clay").trim()];
  const P=[];const n=count||140;for(let i=0;i<n;i++)P.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*26*devicePixelRatio,vy:(-Math.random()*22-8)*devicePixelRatio,r:(Math.random()*5+4)*devicePixelRatio,c:cols[i%cols.length],ball:i%4===0,a:Math.random()*6});
  let f=0;(function step(){ctx.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.7*devicePixelRatio;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=.2;ctx.fillStyle=p.c;
    if(p.ball){ctx.beginPath();ctx.arc(p.x,p.y,p.r*1.3,0,7);ctx.fill();ctx.strokeStyle="rgba(255,255,255,.9)";ctx.lineWidth=1.5*devicePixelRatio;ctx.beginPath();ctx.arc(p.x-p.r,p.y,p.r,-.9,.9);ctx.stroke()}
    else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillRect(-p.r,-p.r/3,p.r*2,p.r/1.5);ctx.restore()}});
    if(++f<150)requestAnimationFrame(step);else ctx.clearRect(0,0,W,H)})();
}

/* ---------- boot ---------- */
function start(data){
  if(data&&data.tab)ui.tab=data.tab;
  const fromInbox=processInbox();
  try{if(!localStorage.getItem("ss-seen-help")){ui.sheet={type:"help"};localStorage.setItem("ss-seen-help","1")}}catch(e){}
  if(location.hash==="#quiz")ui.tab="quiz";
  if(location.hash==="#cards")ui.tab="cards";
  render();
  setInterval(()=>{if(!ui.sheet&&!(document.activeElement&&document.activeElement.matches("input,textarea")))render()},30000);
  if(PUBLIC){canEdit=false;preview=false;render();return}
  const c=window.claude;
  if(!c||!c.use){canEdit=true;preview=true;render();return}
  (async()=>{
    try{
      art=await c.use("artifact");const u=await c.use("user");
      if(art){preview=false;canEdit=u?await u.canEdit():false}
      else{canEdit=true;preview=true}
      if(fromInbox&&canEdit&&art){save();toast("📥 "+fromInbox+" new card"+(fromInbox>1?"s":"")+" added from WhatsApp")}
    }catch(err){canEdit=false}
    render();
  })();
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>({tab:ui.tab}));
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
